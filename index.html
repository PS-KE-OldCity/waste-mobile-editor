<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Waste Mobile Editor</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Waste Editor</div>

    <div class="topActions">
      <button id="diffBtn" type="button" class="ghost" disabled>Zmeny</button>
      <button id="refreshBtn" type="button" class="ghost">Refresh</button>
      <button id="commitBtn" type="button" class="primary" disabled>Commit</button>

      <span id="userBadge" class="badge">Neprihlásený</span>
      <button id="loginBtn" type="button">Login</button>
      <button id="logoutBtn" type="button" hidden>Logout</button>
    </div>
  </header>

  <main class="layout">
    <section id="mapWrap">
      <div id="map"></div>

      <!-- Map controls -->
      <div class="mapControls topRight">
        <button id="locateBtn" type="button" class="mapBtn" title="Moja poloha">⌖</button>
      </div>

      <div class="mapControls bottomRight">
        <button id="newSiteBtn" type="button" class="mapBtn big" title="Pridať stanovište">＋</button>
      </div>

      <!-- Tiny close when editing -->
      <div class="mapControls topLeft editingOnly">
        <button id="clearSelBtn" type="button" class="mapBtn" title="Zrušiť výber">✕</button>
      </div>
    </section>

    <section id="panel" class="panel">
      <div class="panelHeader">
        <div class="selInfo">
          <div id="selTitle" class="selTitle">Vyber stanovište</div>
          <div id="selSub" class="selSub">Klikni na marker v mape.</div>

          <div class="coordsRow">
            <span>lat <b id="latVal">—</b></span>
            <span>lng <b id="lngVal">—</b></span>
            <button id="dirtyBadge" type="button" class="badgeBtn" disabled>Zmeny: 0</button>
          </div>
        </div>
      </div>

      <div id="editForm" class="form"></div>
    </section>
  </main>

  <!-- Diff dialog -->
  <dialog id="diffDialog" class="dialog">
    <form method="dialog" class="dialogForm">
      <h3>Zmeny (diff)</h3>
      <div id="diffBody" class="diffBody"></div>
      <div class="dialogActions">
        <button value="ok">Zavrieť</button>
      </div>
    </form>
  </dialog>

  <!-- Commit dialog -->
  <dialog id="commitDialog" class="dialog">
    <form method="dialog" class="dialogForm">
      <h3>Commit & PR</h3>
      <p id="commitSummary" class="small"></p>

      <label for="commitMsg">Commit message</label>
      <input id="commitMsg" type="text" />

      <div class="dialogActions">
        <button value="cancel">Zrušiť</button>
        <button value="ok">OK</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/auth.js"></script>
  <script src="/github.js"></script>
  <script src="/app.js"></script>
</body>
</html>
