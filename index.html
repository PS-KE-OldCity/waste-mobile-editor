<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waste Mobile Editor</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Waste Editor</div>

    <div class="actions">
      <span id="userBadge" class="badge">Neprihlásený</span>
      <button id="loginBtn" type="button">GitHub Login</button>
      <button id="logoutBtn" type="button" hidden>Logout</button>
    </div>
  </header>

  <main class="layout">
    <section id="map"></section>

    <section class="panel">
      <!-- Sticky header (mobile friendly) -->
      <div class="panelHeader sticky">
        <div class="panelTitle">
          <div id="selTitle" class="title">Vyber stanovište</div>
          <div id="selSub" class="subtitle">Klikni na marker alebo vytvor nové stanovište.</div>
          <div class="coords">
            <span>lat: <b id="latVal">—</b></span>
            <span>lng: <b id="lngVal">—</b></span>
            <span id="dirtyBadge" class="badge">Zmeny: 0</span>
          </div>
        </div>

        <div class="panelBtns">
          <button id="locateBtn" type="button">Moja poloha</button>
          <button id="centerSelBtn" type="button" disabled>Centrovať</button>
          <button id="snapToGpsBtn" type="button" disabled>Presuň na GPS</button>

          <button id="newSiteBtn" type="button">+ Stanovište</button>
          <button id="refreshBtn" type="button">Refresh</button>

          <button id="commitBtn" type="button" disabled>Commit</button>

          <!-- Delete is hidden until a feature is selected -->
          <button id="deleteSiteBtn" type="button" class="danger" hidden disabled>Vymazať</button>
        </div>
      </div>

      <div id="editForm" class="form"></div>
    </section>
  </main>

  <!-- Commit modal -->
  <dialog id="commitDialog" class="dialog">
    <form method="dialog" class="dialogForm">
      <h3>Commit & PR</h3>
      <p id="commitSummary" class="small"></p>

      <label for="commitMsg">Commit message</label>
      <input id="commitMsg" type="text" />

      <div class="dialogActions">
        <button value="cancel">Zrušiť</button>
        <button value="ok">OK</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/auth.js"></script>
  <script src="/github.js"></script>
  <script src="/app.js"></script>
</body>
</html>
