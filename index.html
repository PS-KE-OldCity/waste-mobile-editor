<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Waste Mobile Editor</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Waste Editor</div>

    <div class="topActions">
      <span id="userBadge" class="badge">Neprihlásený</span>
      <button id="loginBtn" type="button">Login</button>
      <button id="logoutBtn" type="button" hidden>Logout</button>
    </div>
  </header>

  <main class="layout">
    <section id="mapWrap">
      <div id="map"></div>
      <div class="mapOverlay">
        <button id="locateBtn" type="button" class="pill">Moja poloha</button>
        <button id="mapToggleBtn" type="button" class="pill">Viac mapy</button>
      </div>
    </section>

    <section id="panel" class="panel">
      <div class="panelHeader">
        <div class="selInfo">
          <div id="selTitle" class="selTitle">Vyber stanovište</div>
          <div id="selSub" class="selSub">Klikni na marker alebo vytvor nové.</div>
          <div class="coordsRow">
            <span>lat <b id="latVal">—</b></span>
            <span>lng <b id="lngVal">—</b></span>
            <span id="dirtyBadge" class="badge">Zmeny: 0</span>
          </div>
        </div>

        <div class="headerBtns">
          <button id="centerSelBtn" type="button" disabled>Centrovať</button>
          <button id="snapToGpsBtn" type="button" disabled>Presuň na GPS</button>

          <button id="newSiteBtn" type="button">+ Stanovište</button>
          <button id="refreshBtn" type="button">Refresh</button>

          <button id="commitBtn" type="button" disabled>Commit</button>
          <button id="deleteSiteBtn" type="button" class="danger" hidden disabled>Vymazať</button>
        </div>
      </div>

      <div id="editForm" class="form"></div>
    </section>
  </main>

  <!-- Add Container dialog -->
  <dialog id="addContainerDialog" class="dialog">
    <form method="dialog" class="dialogForm">
      <h3>Pridať nádobu</h3>
      <p class="small">Klikni na typ. Objem sa predvyplní, môžeš zmeniť.</p>

      <div id="containerTypeGrid" class="typeGrid"></div>

      <div class="rowInline">
        <div class="row grow">
          <label>Objem (l)</label>
          <input id="containerVolume" type="number" min="0" step="1" />
        </div>
        <div class="row">
          <label>Počet</label>
          <input id="containerCount" type="number" min="1" step="1" value="1" />
        </div>
      </div>

      <div class="dialogActions">
        <button value="cancel">Zrušiť</button>
        <button id="addContainerOkBtn" value="ok">Pridať</button>
      </div>
    </form>
  </dialog>

  <!-- Commit modal -->
  <dialog id="commitDialog" class="dialog">
    <form method="dialog" class="dialogForm">
      <h3>Commit & PR</h3>
      <p id="commitSummary" class="small"></p>

      <label for="commitMsg">Commit message</label>
      <input id="commitMsg" type="text" />

      <div class="dialogActions">
        <button value="cancel">Zrušiť</button>
        <button value="ok">OK</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/auth.js"></script>
  <script src="/github.js"></script>
  <script src="/app.js"></script>
</body>
</html>
